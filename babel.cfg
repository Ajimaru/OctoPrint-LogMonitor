[python: */**.py]

[jinja2: */**.jinja2]
silent=false
extensions=jinja2.ext.do, octoprint.util.jinja.trycatch

[javascript: */**.js]
extract_messages = gettext, ngettext
# Disable JSX/E4X parsing. This codebase has no JSX, but Babel's lexer reads
# the regex literal />/g (in escapeHtml()) as a JSX tag close. Tokenisation is
# then off by one from that point on: the rest of the file is swallowed into
# phantom strings and every gettext() call after it is silently dropped from
# the catalog. The value is left empty on purpose -- Babel reads config values
# as strings and only checks truthiness, so "false" or "0" would still enable
# it; only an empty value is falsy.
jsx =
